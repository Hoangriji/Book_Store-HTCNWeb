<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân</title>
    <link rel="stylesheet" href="/CSS/shared/bootstrap.min.css">
    <link rel="stylesheet" href="/CSS/shared/header.css">
    <link rel="stylesheet" href="/CSS/shared/footer.css">
    <link rel="stylesheet" href="/CSS/userDetailPage.css">
    <link rel="shortcut icon" href="/imgs/favicon.ico" type="image/x-icon">
    <!-- icon awesome free -->
    <script src="https://kit.fontawesome.com/81f80860c2.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- header -->
    <header class="inner-header"></header>

    <!-- main -->
    <div class="main py-5">
        <div class="container">
            <div class="row g-4">
                <!-- aside -->
                <aside class="col-lg-3 col-xl-2">
                    <div class="card bg-light border-0 mb-4">
                        <div class="card-body text-center">
                            <div class="avatar-circle mb-3">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="user-name fw-bold fs-5" id="userNameDisplay">Người dùng</div>
                        </div>
                    </div>

                    <!-- nav -->
                    <nav class="d-flex flex-lg-column gap-2 mb-4">
                        <button class="btn w-100 text-start active nav-btn" data-section="profile">
                            <i class="fa-solid fa-address-card me-2"></i><span>Hồ sơ</span>
                        </button>
                    </nav>

                    <!-- logout btn -->
                    <button class="btn btn-danger w-100" id="sidebarLogoutBtn">
                        <i class="fa-solid fa-sign-out-alt me-2"></i> Đăng xuất
                    </button>
                </aside>

                <!-- content section -->
                <section class="col-lg-9 col-xl-10">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-md-4">
                            <!-- profile -->
                            <div class="content-section active" id="profile-section">
                                <h3 class="mb-4 fw-bold">Hồ sơ cá nhân</h3>
                                <form id="profileForm">
                                    <div class="mb-3">
                                        <label for="fullname" class="form-label fw-medium">Họ và tên <span
                                                class="text-danger">*</span></label>
                                        <input type="text" id="fullname" name="fullname" class="form-control" required>
                                        <div class="invalid-feedback d-block mt-1 text-danger" id="fullname-error">
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="username" class="form-label fw-medium">Tên đăng nhập</label>
                                        <input type="text" id="username" name="username" class="form-control" disabled>
                                        <small class="d-block text-muted mt-1"><i
                                                class="fa-solid fa-info-circle me-1"></i>Không thể thay đổi tên đăng
                                            nhập</small>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label fw-medium">Email <span
                                                class="text-danger">*</span></label>
                                        <input type="email" id="email" name="email" class="form-control" required>
                                        <div class="invalid-feedback d-block mt-1 text-danger" id="email-error"></div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="phone" class="form-label fw-medium">Số điện thoại</label>
                                        <input type="tel" id="phone" name="phone" class="form-control"
                                            placeholder="Nhập số điện thoại">
                                        <div class="invalid-feedback d-block mt-1 text-danger" id="phone-error"></div>
                                    </div>

                                    <div class="d-flex gap-2 align-items-center mt-4">
                                        <button type="submit" class="btn btn-danger">Lưu thay đổi</button>
                                        <span class="text-success fw-medium" id="profile-success"></span>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer class="inner-footer"></footer>

    <script src="/JS/shared/header.js"></script>
    <script src="/JS/shared/footer.js"></script>
    <script type="module" src="/JS/shared/main.js"></script>
</body>

</html>
